# Apache / Webuzo reverse proxy for MarvelSoftware ERP.
#
# Public entry point: Apache (Webuzo) owns :80/:443 and TLS. The ERP container
# is published on loopback only at 127.0.0.1:8086.
#
#   Internet -> Apache (HTTPS) -> 127.0.0.1:8086 -> erp container
#
# Modules required (Webuzo ships them): proxy proxy_http headers ssl rewrite
# Verify:
#   /usr/local/apps/apache/bin/httpd -M | grep -E 'proxy|headers|ssl|rewrite'
#
# SELinux (AlmaLinux/Rocky/CentOS with Webuzo):
#   setsebool -P httpd_can_network_connect 1
#
# INSTALL - pick ONE:
#
# (A) VHOST (recommended). Add the PROXY BLOCK below inside the domain's
#     <VirtualHost *:443> in:
#       /usr/local/apps/apache/conf/webuzo/vhosts/<domain>.conf
#     Add it to the :80 vhost too only if that vhost does not redirect to HTTPS.
#     Then test and reload:
#       /usr/local/apps/apache/bin/apachectl configtest
#       /usr/local/apps/apache/bin/apachectl graceful
#
# (B) .htaccess. Copy deploy/apache/subdomain.htaccess into the domain's
#     DocumentRoot as `.htaccess` (needs AllowOverride FileInfo).
#
# ProxyPass is valid ONLY in server/vhost context - never put it in .htaccess.
#
# Multiple applications: each app gets its own loopback port (8086, 8087,
# 8088, ...) and its own vhost. See deploy/apache/README.md for the map.

# ------------------------------- PROXY BLOCK ---------------------------------
# Inside <VirtualHost *:443>:

ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Proto "https"

# Let Let's Encrypt/ACME renewals be served from disk by Apache, not the app.
ProxyPass        /.well-known/ !
ProxyPass        / http://127.0.0.1:8086/ connectiontimeout=5 timeout=120 retry=0
ProxyPassReverse / http://127.0.0.1:8086/

# If you also proxy a plain-HTTP :80 vhost, use "http" instead of "https":
# RequestHeader set X-Forwarded-Proto "http"
# -----------------------------------------------------------------------------

# Health check from the server itself:
#   curl -fsS http://127.0.0.1:8086/api/health
