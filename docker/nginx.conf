# nginx INSIDE the all-in-one ERP container.
#
# Public TLS and the domain belong to Apache/Webuzo on the host. This file only
# listens on the container's unprivileged port 8080 and proxies /api to the Node
# process on the same container. Nothing here is exposed directly.

# Preserve the scheme Apache sends; fall back to http for direct health checks.
map $http_x_forwarded_proto $erp_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Cheap liveness probe that does not depend on the API or the database.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets: cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API passthrough. No trailing slash on proxy_pass, so /api/... is preserved
    # (the Express app mounts every route under /api).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $erp_forwarded_proto;
        proxy_set_header Connection        "";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # React Router / deep links: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
