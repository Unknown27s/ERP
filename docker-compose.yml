# Deployment for the MarvelSoftware platform.
#
# Topology (Option B — dedicated port; see deploy/apache/subdomain-vhost.conf):
#   Internet -> Apache / Webuzo (TLS on 80/443)
#             -> 127.0.0.1:8083
#                -> erp-web (nginx: SPA + /api proxy)
#                   -> erp-api :4000 -> Supabase Cloud (managed Postgres)
#
# Service names are prefixed (erp-*) so this stack can also join a shared
# network without clashing with web/api/postgres/redis there.
#
# Usage:
#   cp .env.example .env      # DATABASE_URL, JWT_SECRET, SMTP_* …
#   docker compose up -d --build
#   docker compose logs -f erp-api

services:
  erp-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: marvel-software/api:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    expose:
      - "4000"
    # DATABASE_URL points at Supabase Cloud (managed Postgres) over the public
    # internet, so the container just dials out on 5432 — no host gateway mapping
    # and no shared Docker network are needed.
    restart: unless-stopped
    networks:
      - app

  erp-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: marvel-software/web:latest
    depends_on:
      erp-api:
        condition: service_healthy
    ports:
      # Loopback only. 8083 = first free port after your existing 8080/8081/8082.
      # Override with WEB_PORT=8090 docker compose up -d if 8083 is taken.
      - "127.0.0.1:${WEB_PORT:-8083}:80"
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
