# Production stack for MarvelSoftware ERP — one all-in-one image.
#
#   Internet -> Apache/Webuzo :443 -> 127.0.0.1:8086 -> erp (nginx :8080 -> API :4000)
#
# Server policy for co-hosted applications:
#   * every application gets its own compose project;
#   * every application gets its own bridge network (erp_net here);
#   * every application gets its own loopback-only port (8086-8099 here).
# This stack uses 8086. Do not reuse that port for another app on the box.
#
# Usage (from the repo root):
#   cp .env.example .env      # then set DATABASE_URL, JWT_SECRET, SMTP_*
#   docker compose up -d --build
#   docker compose logs -f erp
#
# Apache/Webuzo config: deploy/apache/subdomain-vhost.conf
# Full runbook:         deploy/README.md

name: erp

services:
  erp:
    build:
      context: .
      dockerfile: Dockerfile
    image: marvel-software/erp:latest
    container_name: erp
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    ports:
      # Loopback only — never 0.0.0.0. Apache/Webuzo is the public entry point.
      # Change ERP_PORT in .env if 8086 is already taken on the host.
      - "127.0.0.1:${ERP_PORT:-8086}:8080"
    restart: unless-stopped
    networks:
      - erp_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # A named, application-scoped bridge. Other co-hosted apps must use their own
  # network name (lms_net, crm_net, …) so DNS/service names can never collide.
  erp_net:
    name: erp_net
    driver: bridge
    # Only pin a subnet if another stack must peer with this one; otherwise let
    # Docker allocate a free range. If you pin it, pick a range no other stack
    # uses, e.g.:
    # ipam:
    #   config:
    #     - subnet: 172.31.99.0/24
